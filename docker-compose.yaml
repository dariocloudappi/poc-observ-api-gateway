# =============================================================================
# Tyk OSS + Tyk Pump + OpenTelemetry Collector + New Relic - local stack
# -----------------------------------------------------------------------------
# No credential is written in this file. Every value comes from .env, which is
# git ignored. Use .env.example as the reference.
# Published ports are bound to 127.0.0.1 so nothing is exposed on the host
# network interfaces by accident.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-tyk-otel-newrelic}

services:

  tyk-redis:
    image: redis:7.2-alpine
    container_name: tyk-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - tyk-internal-net
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION:-0.100.0}
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      NR_LICENSE_KEY: ${NR_LICENSE_KEY:?NR_LICENSE_KEY is required}
      NR_OTLP_ENDPOINT: ${NR_OTLP_ENDPOINT:-https://otlp.eu01.nr-data.net:4318}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-poc-observability}
      REDIS_ENDPOINT: ${REDIS_ENDPOINT:-tyk-redis:6379}
      TYK_PUMP_METRICS_ENDPOINT: ${TYK_PUMP_METRICS_ENDPOINT:-tyk-pump:9090}
      OTEL_TELEMETRY_LOG_LEVEL: ${OTEL_TELEMETRY_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP
      - "127.0.0.1:8888:8888"    # Collector internal metrics
      - "127.0.0.1:13133:13133"  # Health check
      - "127.0.0.1:24224:24224"  # Fluent Forward, logs from the gateway
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    networks:
      - tyk-internal-net
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  tyk-gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
      args:
        TYK_VERSION: ${TYK_VERSION:-v5.12.0}
    image: ${TYK_GATEWAY_IMAGE:-poc-tyk-gateway:local}
    container_name: tyk-gateway
    ports:
      - "${TYK_PORT:-8443}:${TYK_LISTEN_PORT:-8080}"
    environment:
      # Gateway identity and admin API
      TYK_GW_SECRET: ${TYK_SECRET:?TYK_SECRET is required}
      TYK_GW_NODESECRET: ${TYK_NODE_SECRET:?TYK_NODE_SECRET is required}
      TYK_GW_LISTENPORT: ${TYK_LISTEN_PORT:-8080}

      # TLS termination inside the gateway. Enabled locally, disabled in Azure
      # where the Container Apps ingress terminates TLS.
      TYK_GW_HTTPSERVEROPTIONS_USESSL: ${TYK_HTTP_USE_SSL:-true}

      # Storage
      TYK_GW_STORAGE_HOST: ${REDIS_HOST:-tyk-redis}
      TYK_GW_STORAGE_PORT: ${REDIS_INTERNAL_PORT:-6379}

      # API definitions rendered by the entrypoint
      TYK_ORG_ID: ${TYK_ORG_ID:-poc-organization}
      TYK_DETAILED_TRACING: ${TYK_DETAILED_TRACING:-true}
      UPSTREAM_USERS_TARGET_URL: ${UPSTREAM_USERS_TARGET_URL:?UPSTREAM_USERS_TARGET_URL is required}
      UPSTREAM_USERS_BASIC_USER: ${UPSTREAM_USERS_BASIC_USER:?UPSTREAM_USERS_BASIC_USER is required}
      UPSTREAM_USERS_BASIC_PASSWORD: ${UPSTREAM_USERS_BASIC_PASSWORD:?UPSTREAM_USERS_BASIC_PASSWORD is required}
      UPSTREAM_ORDERS_TARGET_URL: ${UPSTREAM_ORDERS_TARGET_URL:?UPSTREAM_ORDERS_TARGET_URL is required}
      UPSTREAM_ORDERS_BASIC_USER: ${UPSTREAM_ORDERS_BASIC_USER:?UPSTREAM_ORDERS_BASIC_USER is required}
      UPSTREAM_ORDERS_BASIC_PASSWORD: ${UPSTREAM_ORDERS_BASIC_PASSWORD:?UPSTREAM_ORDERS_BASIC_PASSWORD is required}

      # Analytics consumed by Tyk Pump
      TYK_GW_ENABLEANALYTICS: ${TYK_ENABLE_ANALYTICS:-true}
      TYK_GW_ANALYTICSCONFIG_ENABLEDETAILEDRECORDING: ${TYK_ENABLE_DETAILED_RECORDING:-false}

      # Logging
      TYK_GW_LOGLEVEL: ${TYK_LOG_LEVEL:-info}
      TYK_GW_LOGFORMAT: ${TYK_GW_LOGFORMAT:-json}
      TYK_GW_ACCESSLOGS_ENABLED: ${TYK_GW_ACCESSLOGS_ENABLED:-true}
      TYK_GW_ACCESSLOGS_TEMPLATE: ${TYK_GW_ACCESSLOGS_TEMPLATE:-method,path,status,latency_total,latency_gateway,upstream_latency,trace_id,api_id,api_key,client_ip,user_agent,upstream_status,upstream_addr}
      TYK_GW_TRACK404LOGS: ${TYK_GW_TRACK404LOGS:-false}

      # Log shipping. Locally the fluentd docker driver is used, so the
      # logstash transport stays off. In Azure it is the other way round.
      TYK_GW_USELOGSTASH: ${TYK_GW_USE_LOGSTASH:-false}
      TYK_GW_LOGSTASHTRANSPORT: ${TYK_GW_LOGSTASH_TRANSPORT:-tcp}
      TYK_GW_LOGSTASHNETWORKADDR: ${TYK_GW_LOGSTASH_ADDR:-otel-collector:5170}

      # OpenTelemetry traces
      TYK_GW_OPENTELEMETRY_ENABLED: ${TYK_GW_OTEL_ENABLED:-true}
      TYK_GW_OPENTELEMETRY_EXPORTER: ${TYK_GW_OTEL_EXPORTER:-grpc}
      TYK_GW_OPENTELEMETRY_ENDPOINT: ${TYK_GW_OTEL_ENDPOINT:-otel-collector:4317}
      TYK_GW_OPENTELEMETRY_RESOURCENAME: ${TYK_GW_OTEL_RESOURCE_NAME:-tyk-gateway}
      TYK_GW_OPENTELEMETRY_CUSTOMTRACEHEADERS: ${TYK_GW_OTEL_CUSTOM_TRACE_HEADERS:-}
      TYK_GW_OPENTELEMETRY_CONTEXTPROPAGATION: ${TYK_GW_OTEL_CONTEXT_PROPAGATION:-tracecontext}
      TYK_GW_OPENTELEMETRY_CONNECTIONTIMEOUT: ${TYK_GW_OTEL_CONNECTION_TIMEOUT:-10}
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        fluentd-async: "true"
        fluentd-buffer-limit: "8388608"
        fluentd-retry-wait: "1s"
        # Same spelling as service.name everywhere else: tyk-gateway.
        tag: "tyk-gateway"
    volumes:
      # Definiciones de API renderizadas en el HOST por scripts/render-apis.sh.
      # No se renderizan dentro del contenedor porque la imagen de Tyk es
      # distroless y no tiene shell. Ejecuta antes:
      #   set -a && . ./.env && set +a && ./scripts/render-apis.sh
      - ./tyk/apps-rendered:/opt/tyk-gateway/apps:ro
      - ./tyk/certs:/opt/tyk-gateway/certs:ro
      - ./tyk/middleware:/opt/tyk-gateway/middleware:ro
    depends_on:
      tyk-redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - tyk-internal-net
      - tyk-public-net

  tyk-pump:
    build:
      context: .
      dockerfile: docker/pump.Dockerfile
      args:
        TYK_PUMP_VERSION: ${TYK_PUMP_VERSION:-v1.12.0}
    image: ${TYK_PUMP_IMAGE:-poc-tyk-pump:local}
    container_name: tyk-pump
    environment:
      TYK_PMP_ANALYTICSSTORAGECONFIG_HOST: ${REDIS_HOST:-tyk-redis}
      TYK_PMP_ANALYTICSSTORAGECONFIG_PORT: ${REDIS_INTERNAL_PORT:-6379}
      TYK_PMP_PURGEDELAY: ${TYK_PUMP_PURGE_DELAY:-10}
      TYK_LOGLEVEL: ${TYK_PUMP_LOG_LEVEL:-info}
    depends_on:
      tyk-redis:
        condition: service_healthy
    networks:
      - tyk-internal-net

networks:
  tyk-public-net:
    driver: bridge
    name: tyk-public-network
  tyk-internal-net:
    driver: bridge
    name: tyk-internal-network
