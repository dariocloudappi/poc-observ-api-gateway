# =============================================================================
# deploy.yml - build and deploy the Tyk OSS PoC to Azure Container Apps
# -----------------------------------------------------------------------------
# Authentication uses OIDC federated credentials: there is no client secret
# stored anywhere. Every sensitive value comes from GitHub Secrets and is
# passed to Bicep through environment variables, so it never appears in the
# command line, in a file of the repository or in the logs.
# =============================================================================

name: deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      provision_keys:
        description: 'Create the consumer keys in the gateway after the deployment'
        required: false
        default: 'true'
      observability_enabled:
        description: 'Deploy the Tyk Pump and OpenTelemetry Collector sidecars'
        required: false
        default: 'true'

# OIDC needs id-token write. Nothing else is required.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-tyk-poc
  cancel-in-progress: false

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  POC_NAME_PREFIX: ${{ vars.POC_NAME_PREFIX || 'tykpoc' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-tykpoc' }}
  POC_OWNER: ${{ vars.POC_OWNER || 'unknown' }}
  POC_TTL: ${{ vars.POC_TTL || '1h' }}
  LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS || '30' }}
  LOG_DAILY_QUOTA_GB: ${{ vars.LOG_DAILY_QUOTA_GB || '1' }}
  ENABLE_ACTIVITY_LOG_EXPORT: ${{ vars.ENABLE_ACTIVITY_LOG_EXPORT || 'true' }}
  ENABLE_LOG_ANALYTICS: ${{ vars.ENABLE_LOG_ANALYTICS || 'true' }}
  NR_EXCLUDE_PLATFORM_LOGS: ${{ vars.NR_EXCLUDE_PLATFORM_LOGS || 'false' }}
  ASSIGN_ACR_PULL_ROLE: ${{ vars.ASSIGN_ACR_PULL_ROLE || 'true' }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'poc' }}
  SERVICE_NAMESPACE: ${{ vars.SERVICE_NAMESPACE || 'poc-observability' }}
  NR_OTLP_ENDPOINT: ${{ vars.NR_OTLP_ENDPOINT || 'https://otlp.eu01.nr-data.net:4318' }}
  TYK_VERSION: ${{ vars.TYK_VERSION || 'v5.12.0' }}
  TYK_PUMP_VERSION: ${{ vars.TYK_PUMP_VERSION || 'v1.12.0' }}
  OTEL_VERSION: ${{ vars.OTEL_VERSION || '0.100.0' }}
  # Imagen del sidecar que mantiene las credenciales de consumidor.
  CURL_VERSION: ${{ vars.CURL_VERSION || '8.8.0' }}
  # Un span por middleware de Tyk. Muy util para ver por donde se va el
  # tiempo dentro del gateway, pero multiplica el volumen de spans. Estaba
  # fijado a true en el Bicep y no se podia apagar sin editarlo.
  TYK_DETAILED_TRACING: ${{ vars.TYK_DETAILED_TRACING || 'true' }}
  # Version reportada como service.version en la telemetria del gateway.
  SERVICE_VERSION: ${{ vars.TYK_VERSION || 'v5.12.0' }}
  UPSTREAM_USERS_TARGET_URL: ${{ vars.UPSTREAM_USERS_TARGET_URL }}
  UPSTREAM_ORDERS_TARGET_URL: ${{ vars.UPSTREAM_ORDERS_TARGET_URL }}

jobs:

  # ---------------------------------------------------------------------------
  # La integracion nativa de New Relic, garantizada en cada despliegue
  # ---------------------------------------------------------------------------
  # Mismo job que en los dos repositorios de microservicios, y por el mismo
  # motivo: sin el recurso monitor NINGUN log de Azure Monitor llega a New Relic.
  # Aqui importa para los eventos del ACR y los del Container Apps Environment.
  #
  # Es idempotente y no toca el monitor si ya existe, asi que tenerlo en los tres
  # repositorios no duplica nada: el primero que despliegue lo crea. Sin el, un
  # PoC desplegado SOLO desde el gateway se quedaba sin logs de plataforma.
  #
  # Si faltan los secrets de New Relic, avisa y no hace nada en lugar de fallar.
  newrelic-monitor:
    name: Ensure the New Relic native integration
    uses: ./.github/workflows/newrelic-native-integration.yml
    secrets: inherit
    with:
      skip_if_unconfigured: 'true'

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    outputs:
      gateway_url: ${{ steps.app.outputs.url }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Mask every secret that is going to travel through the job, so an
      # accidental echo cannot leak it into the logs.
      - name: Mask sensitive values
        env:
          TYK_SECRET: ${{ secrets.TYK_SECRET }}
          TYK_NODE_SECRET: ${{ secrets.TYK_NODE_SECRET }}
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
          UPSTREAM_USERS_BASIC_USER: ${{ secrets.UPSTREAM_USERS_BASIC_USER }}
          UPSTREAM_USERS_BASIC_PASSWORD: ${{ secrets.UPSTREAM_USERS_BASIC_PASSWORD }}
          UPSTREAM_ORDERS_BASIC_USER: ${{ secrets.UPSTREAM_ORDERS_BASIC_USER }}
          UPSTREAM_ORDERS_BASIC_PASSWORD: ${{ secrets.UPSTREAM_ORDERS_BASIC_PASSWORD }}
        run: |
          for name in TYK_SECRET TYK_NODE_SECRET NR_LICENSE_KEY \
                      UPSTREAM_USERS_BASIC_USER UPSTREAM_USERS_BASIC_PASSWORD \
                      UPSTREAM_ORDERS_BASIC_USER UPSTREAM_ORDERS_BASIC_PASSWORD; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "ERROR: required secret $name is not configured in the repository" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done
          echo "All required secrets are present."

      - name: Validate non secret configuration
        run: |
          # Ojo: estas dos se leen con vars.*, no con secrets.*, asi que tienen
          # que estar en la pestana Variables. Creadas como secret, vars.* las ve
          # vacias y este paso fallaba sin explicar por que.
          #
          # Ya no es obligatorio rellenarlas: si estan vacias, el paso
          # "Resolve the upstream urls" las descubre por etiqueta.
          for v in UPSTREAM_USERS_TARGET_URL UPSTREAM_ORDERS_TARGET_URL; do
            if [ -z "${!v}" ]; then
              echo "${v} is not set as a repository VARIABLE. It will be discovered from Azure."
            else
              case "${!v}" in
                */) echo "ERROR: ${v} must not end with a slash" >&2; exit 1 ;;
              esac
            fi
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      # ---------------------------------------------------------------------
      # Descubrimiento de los upstreams
      # ---------------------------------------------------------------------
      # Las urls de los microservicios NO se pegan a mano. Se resuelven
      # preguntando a Azure por las Web Apps etiquetadas con su project, que es
      # el mismo mecanismo que usa orders para descubrir este gateway.
      #
      # Las variables de repositorio siguen funcionando como override manual: si
      # tienen valor, ganan y no se descubre nada.
      - name: Resolve the upstream urls
        run: |
          set -euo pipefail

          discover() {
            az webapp list               --query "[?tags.project=='$1' && tags.environment=='poc'].defaultHostName | [0]"               -o tsv 2>/dev/null || true
          }

          missing=""
          for pair in "UPSTREAM_USERS_TARGET_URL:poc-microservice-users"                       "UPSTREAM_ORDERS_TARGET_URL:poc-microservice-orders"; do
            var="${pair%%:*}"
            project="${pair##*:}"

            if [ -n "${!var}" ]; then
              echo "${var} is set explicitly: ${!var}. Skipping discovery."
              continue
            fi

            host=$(discover "$project")
            if [ -z "$host" ] || [ "$host" = "None" ]; then
              missing="${missing} ${project}"
              continue
            fi
            echo "${var} discovered: https://${host}"
            echo "${var}=https://${host}" >> "$GITHUB_ENV"
          done

          if [ -n "$missing" ]; then
            echo "ERROR: no web app tagged environment=poc was found for:${missing}" >&2
            echo "The gateway cannot route to an upstream that does not exist." >&2
            echo "Deploy those microservices first, or set the corresponding" >&2
            echo "UPSTREAM_*_TARGET_URL repository VARIABLE by hand." >&2
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Stage 1: resource group, Log Analytics, registry, identity, environment
      # ---------------------------------------------------------------------
      - name: Deploy foundation
        id: foundation
        run: |
          set -euo pipefail
          # The .bicepparam file declares its own template through "using",
          # so --template-file must not be passed here.
          outputs=$(az deployment sub create \
            --name "foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location "$AZURE_LOCATION" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)

          echo "acr_name=$(echo "$outputs" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(echo "$outputs" | jq -r .acrLoginServer.value)" >> "$GITHUB_OUTPUT"
          echo "cae_name=$(echo "$outputs" | jq -r .managedEnvironmentName.value)" >> "$GITHUB_OUTPUT"
          echo "identity_id=$(echo "$outputs" | jq -r .managedIdentityId.value)" >> "$GITHUB_OUTPUT"
          echo "workspace_name=$(echo "$outputs" | jq -r .logAnalyticsWorkspaceName.value)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Stage 2: images
      # ---------------------------------------------------------------------
      - name: Log in to the container registry
        run: az acr login --name "${{ steps.foundation.outputs.acr_name }}"

      - name: Build and push images
        id: images
        env:
          ACR: ${{ steps.foundation.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"

          docker build \
            --file docker/gateway.Dockerfile \
            --build-arg "TYK_VERSION=${TYK_VERSION}" \
            --tag "${ACR}/tyk-gateway:${TAG}" .

          docker build \
            --file docker/pump.Dockerfile \
            --build-arg "TYK_PUMP_VERSION=${TYK_PUMP_VERSION}" \
            --tag "${ACR}/tyk-pump:${TAG}" .

          docker build \
            --file docker/otel.Dockerfile \
            --build-arg "OTEL_VERSION=${OTEL_VERSION}" \
            --tag "${ACR}/otel-collector:${TAG}" .

          # Sidecar que reescribe las credenciales de consumidor en Redis
          # en cada arranque de replica. Sin el, un reinicio deja el gateway
          # devolviendo 401 a todo el mundo: las credenciales de Tyk viven
          # solo en Redis y Redis aqui no tiene persistencia.
          docker build \
            --file docker/provisioner.Dockerfile \
            --build-arg "CURL_VERSION=${CURL_VERSION}" \
            --tag "${ACR}/key-provisioner:${TAG}" .

          docker push "${ACR}/tyk-gateway:${TAG}"
          docker push "${ACR}/tyk-pump:${TAG}"
          docker push "${ACR}/otel-collector:${TAG}"
          docker push "${ACR}/key-provisioner:${TAG}"

          echo "gateway=${ACR}/tyk-gateway:${TAG}" >> "$GITHUB_OUTPUT"
          echo "pump=${ACR}/tyk-pump:${TAG}" >> "$GITHUB_OUTPUT"
          echo "otel=${ACR}/otel-collector:${TAG}" >> "$GITHUB_OUTPUT"
          echo "provisioner=${ACR}/key-provisioner:${TAG}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Definiciones de API
      # ---------------------------------------------------------------------
      # Se renderizan AQUI y no dentro del contenedor: la imagen de Tyk es
      # distroless desde la v5.3 y no tiene shell, asi que un entrypoint de sh
      # no puede arrancar. Tampoco se hornean en la imagen, porque llevan la
      # cabecera Authorization: Basic de cada upstream.
      #
      # El resultado viaja en base64 para que el JSON llegue intacto, y termina
      # como secreto del Container App montado en /opt/tyk-gateway/apps.
      - name: Render the Tyk API definitions
        id: apis
        env:
          UPSTREAM_USERS_BASIC_USER: ${{ secrets.UPSTREAM_USERS_BASIC_USER }}
          UPSTREAM_USERS_BASIC_PASSWORD: ${{ secrets.UPSTREAM_USERS_BASIC_PASSWORD }}
          UPSTREAM_ORDERS_BASIC_USER: ${{ secrets.UPSTREAM_ORDERS_BASIC_USER }}
          UPSTREAM_ORDERS_BASIC_PASSWORD: ${{ secrets.UPSTREAM_ORDERS_BASIC_PASSWORD }}
          TYK_ORG_ID: ${{ vars.TYK_ORG_ID || 'poc-organization' }}
        run: |
          set -euo pipefail
          # Se invoca con bash a proposito, no como ./script: asi no depende del
          # bit de ejecucion. En Windows core.filemode suele estar en false, el
          # chmod local no se registra en git y el runner recibe el fichero sin
          # permisos (exit 126, Permission denied). El modo 100755 esta ademas
          # registrado en el indice, pero esto lo hace inmune de todas formas.
          bash scripts/render-apis.sh tyk/apps-rendered

          # base64 en una sola linea, para pasarlo por variable de entorno.
          users_b64=$(base64 -w0 tyk/apps-rendered/api-users.json)
          orders_b64=$(base64 -w0 tyk/apps-rendered/api-orders.json)

          # Contienen credenciales: enmascarar antes de que puedan aparecer.
          echo "::add-mask::${users_b64}"
          echo "::add-mask::${orders_b64}"

          echo "API_DEFINITION_USERS_B64=${users_b64}" >> "$GITHUB_ENV"
          echo "API_DEFINITION_ORDERS_B64=${orders_b64}" >> "$GITHUB_ENV"

          echo "Rendered definitions:"
          ls -l tyk/apps-rendered/

      # ---------------------------------------------------------------------
      # Stage 3: workload
      # ---------------------------------------------------------------------
      # Secrets are exported as environment variables and read by the
      # bicepparam file, so they never appear as command line arguments.
      - name: Deploy container app
        id: app
        env:
          AZURE_CAE_NAME: ${{ steps.foundation.outputs.cae_name }}
          AZURE_IDENTITY_ID: ${{ steps.foundation.outputs.identity_id }}
          AZURE_ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
          IMAGE_GATEWAY: ${{ steps.images.outputs.gateway }}
          IMAGE_PUMP: ${{ steps.images.outputs.pump }}
          IMAGE_OTEL: ${{ steps.images.outputs.otel }}
          IMAGE_PROVISIONER: ${{ steps.images.outputs.provisioner }}
          TYK_ORG_ID: ${{ vars.TYK_ORG_ID || 'poc-organization' }}
          # Credenciales de consumidor: las consume el sidecar dentro de la
          # replica para reescribirlas en Redis tras cada reinicio.
          USERNAME_API_USERS: ${{ secrets.USERNAME_API_USERS }}
          PASSWORD_API_USERS: ${{ secrets.PASSWORD_API_USERS }}
          USERNAME_API_ORDERS: ${{ secrets.USERNAME_API_ORDERS }}
          PASSWORD_API_ORDERS: ${{ secrets.PASSWORD_API_ORDERS }}
          OBSERVABILITY_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.observability_enabled || 'true' }}
          TYK_ENABLE_DETAILED_RECORDING: ${{ vars.TYK_ENABLE_DETAILED_RECORDING || 'false' }}
          TYK_LOG_LEVEL: ${{ vars.TYK_LOG_LEVEL || 'debug' }}
          OTEL_TELEMETRY_LOG_LEVEL: ${{ vars.OTEL_TELEMETRY_LOG_LEVEL || 'info' }}
          TYK_SECRET: ${{ secrets.TYK_SECRET }}
          TYK_NODE_SECRET: ${{ secrets.TYK_NODE_SECRET }}
          NR_LICENSE_KEY: ${{ secrets.NR_LICENSE_KEY }}
          # Las credenciales de upstream NO se pasan aqui: ya estan dentro de las
          # definiciones de API renderizadas, que llegan en API_DEFINITION_*_B64
          # desde el paso anterior a traves de GITHUB_ENV.
        run: |
          set -euo pipefail

          # Bicep resolves readEnvironmentVariable at compile time, so an empty
          # value would reach the template silently. Fail here with a clear
          # message instead.
          for name in AZURE_CAE_NAME AZURE_IDENTITY_ID AZURE_ACR_LOGIN_SERVER \
                      IMAGE_GATEWAY IMAGE_PUMP IMAGE_OTEL IMAGE_PROVISIONER \
                      API_DEFINITION_USERS_B64 API_DEFINITION_ORDERS_B64; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: ${name} is empty. The foundation stage did not return it." >&2
              exit 1
            fi
          done

          outputs=$(az deployment group create \
            --name "app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --parameters infra/app.bicepparam \
            --query properties.outputs -o json)

          url=$(echo "$outputs" | jq -r .url.value)
          fqdn=$(echo "$outputs" | jq -r .fqdn.value)
          app_name=$(echo "$outputs" | jq -r .containerAppName.value)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "fqdn=${fqdn}" >> "$GITHUB_OUTPUT"
          # Necesario para los comandos az del resumen del despliegue, que
          # explican como consultar el usuario y revelar la contrasena.
          echo "container_app_name=${app_name}" >> "$GITHUB_OUTPUT"
          echo "Gateway published at ${url}"

      # ---------------------------------------------------------------------
      # Stage 4: smoke tests over HTTPS
      # ---------------------------------------------------------------------
      - name: Smoke test - gateway health over HTTPS
        env:
          URL: ${{ steps.app.outputs.url }}
        run: |
          set -euo pipefail
          echo "Waiting for ${URL}/hello ..."
          for attempt in $(seq 1 40); do
            body=$(curl --silent --show-error --max-time 10 "${URL}/hello" || true)
            if echo "$body" | grep -q "pass"; then
              echo "Gateway is healthy after ${attempt} attempt(s)."
              echo "$body"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: the gateway did not answer /hello over HTTPS" >&2
          exit 1

      - name: Smoke test - TLS is enforced and certificate is valid
        env:
          FQDN: ${{ steps.app.outputs.fqdn }}
        run: |
          set -euo pipefail
          # curl validates the certificate chain by default: no --insecure here.
          tls_version=$(curl --silent --show-error --output /dev/null \
            --write-out '%{ssl_verify_result} %{http_version}' "https://${FQDN}/hello")
          echo "ssl_verify_result and http_version: ${tls_version}"

          # Plain HTTP must not serve content: the ingress redirects to HTTPS.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://${FQDN}/hello")
          echo "Plain HTTP returned ${code}"
          case "$code" in
            30*|403|404) echo "Plain HTTP is not served, as expected." ;;
            200) echo "ERROR: the gateway answered over plain HTTP" >&2; exit 1 ;;
            *) echo "Unexpected status ${code} over plain HTTP" ;;
          esac

      - name: Smoke test - APIs reject anonymous traffic
        env:
          URL: ${{ steps.app.outputs.url }}
        run: |
          set -euo pipefail
          for path in /api-users/v1 /api-orders/v1; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "${URL}${path}")
            echo "${path} without credentials returned ${code}"
            if [ "$code" != "401" ] && [ "$code" != "400" ]; then
              echo "ERROR: ${path} should reject anonymous requests" >&2
              exit 1
            fi
          done

      # ---------------------------------------------------------------------
      # Stage 5: optional consumer key provisioning
      # ---------------------------------------------------------------------
      - name: Provision consumer keys
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision_keys == 'true' }}
        env:
          GATEWAY_BASE_URL: ${{ steps.app.outputs.url }}
          GATEWAY_ALLOW_INSECURE_TLS: 'false'
          TYK_SECRET: ${{ secrets.TYK_SECRET }}
          TYK_ORG_ID: ${{ vars.TYK_ORG_ID || 'poc-organization' }}
          USERNAME_API_USERS: ${{ secrets.USERNAME_API_USERS }}
          PASSWORD_API_USERS: ${{ secrets.PASSWORD_API_USERS }}
          USERNAME_API_ORDERS: ${{ secrets.USERNAME_API_ORDERS }}
          PASSWORD_API_ORDERS: ${{ secrets.PASSWORD_API_ORDERS }}
        run: |
          set -euo pipefail
          if [ -z "${USERNAME_API_USERS}" ] && [ -z "${USERNAME_API_ORDERS}" ]; then
            {
              echo "### Faltan los secrets de las credenciales de consumidor"
              echo
              echo "Configura en Settings -> Secrets and variables -> Actions:"
              echo
              echo "| Secret | Para |"
              echo "| --- | --- |"
              echo "| USERNAME_API_USERS / PASSWORD_API_USERS | consumir api-users |"
              echo "| USERNAME_API_ORDERS / PASSWORD_API_ORDERS | consumir api-orders |"
              echo
              echo "Son SECRETS del repositorio, no variables, y no llegan al"
              echo "contenedor: solo los usa provision_key.sh contra la API de"
              echo "administracion de Tyk para crear la credencial en Redis."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "ERROR: no hay credenciales de consumidor configuradas." >&2
            echo "Las APIs usan use_basic_auth, asi que sin credenciales el gateway" >&2
            echo "rechaza toda peticion con 401. Ver el resumen del despliegue." >&2
            exit 1
          fi

          # Un solo par configurado es valido, pero conviene avisar: la otra API
          # quedara inaccesible y el sintoma sera un 401 dificil de atribuir.
          for pair in "USERNAME_API_USERS:api-users" "USERNAME_API_ORDERS:api-orders"; do
            var="${pair%%:*}"
            api="${pair##*:}"
            if [ -z "${!var}" ]; then
              echo "AVISO: ${var} no esta configurado. ${api} quedara sin credenciales y devolvera 401."
            fi
          done
          echo "::add-mask::${PASSWORD_API_USERS}"
          echo "::add-mask::${PASSWORD_API_ORDERS}"
          chmod +x ./provision_key.sh
          ./provision_key.sh

      # ---------------------------------------------------------------------
      # Stage 6: la credencial funciona de verdad
      # ---------------------------------------------------------------------
      # Sin este paso el fallo era SILENCIOSO. El despliegue salia verde y el
      # consumidor recibia 401 {"error": "User not authorised"}, que Tyk emite
      # tanto si el usuario no existe en Redis como si la contrasena no
      # coincide. Nada en la pipeline lo detectaba.
      #
      # Se comprueban las dos direcciones, porque una sola no prueba nada:
      #
      #   credencial correcta   -> NO debe ser 401 ni 403
      #   credencial incorrecta -> SI debe ser 401
      #
      # Sin la segunda, una API mal configurada como keyless pasaria la primera
      # comprobacion sin autenticar a nadie.
      #
      # Un 502, 503 o 404 con la credencial correcta se ACEPTA: significa que
      # la autenticacion paso y el fallo esta en el upstream, que es otro
      # problema y tiene sus propias comprobaciones.
      - name: Verify the consumer credentials against the gateway
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.provision_keys == 'true' }}
        env:
          URL: ${{ steps.app.outputs.url }}
          TYK_SECRET: ${{ secrets.TYK_SECRET }}
          TYK_ORG_ID: ${{ vars.TYK_ORG_ID || 'poc-organization' }}
          USERNAME_API_USERS: ${{ secrets.USERNAME_API_USERS }}
          PASSWORD_API_USERS: ${{ secrets.PASSWORD_API_USERS }}
          USERNAME_API_ORDERS: ${{ secrets.USERNAME_API_ORDERS }}
          PASSWORD_API_ORDERS: ${{ secrets.PASSWORD_API_ORDERS }}
        run: |
          set -euo pipefail
          echo "::add-mask::${PASSWORD_API_USERS}"
          echo "::add-mask::${PASSWORD_API_ORDERS}"

          failed=0

          check() {
            local label="$1" path="$2" user="$3" pass="$4"

            if [ -z "$user" ] || [ -z "$pass" ]; then
              echo "  ${label}: sin credenciales configuradas, se omite"
              return 0
            fi

            # --- 1) la credencial correcta NO debe dar 401 ni 403 ---
            local ok_code
            ok_code=$(curl --silent --output /dev/null --write-out '%{http_code}'               --max-time 30 --user "${user}:${pass}" "${URL}${path}")

            if [ "$ok_code" = "403" ]; then
              # 403 y 401 son problemas DISTINTOS, medido contra el gateway:
              #   403 -> la clave existe y autentica, pero su access_rights
              #          apunta a un api_id que no coincide con el de la
              #          definicion de API cargada
              #   401 -> el usuario no existe en Redis, o la contrasena no casa
              echo "  ${label}: FALLO -> ${path} devolvio 403"
              echo "           la credencial autentica, pero su access_rights no"
              echo "           coincide con el api_id de la definicion de API."
              failed=1

            elif [ "$ok_code" = "401" ]; then
              echo "  ${label}: FALLO -> ${path} devolvio 401 con la credencial correcta"

              # De donde viene el 401? Tyk y el upstream devuelven los dos un
              # 401 y se distinguen por el CUERPO, medido contra el gateway:
              #
              #   Tyk       -> {"error": "User not authorised"}
              #   upstream  -> lo que devuelva el micro, sin esa firma
              #
              # Distinguirlo es clave: el primero se arregla con los secrets
              # USERNAME_API_* / PASSWORD_API_*, y el segundo con los
              # UPSTREAM_*_BASIC_*, que son credenciales DISTINTAS. Tyk
              # sustituye la cabecera Authorization del consumidor por la del
              # upstream antes de reenviar, asi que un 401 del micro no tiene
              # nada que ver con la credencial que uso el cliente.
              local body
              body=$(curl --silent --max-time 30 --user "${user}:${pass}" "${URL}${path}" || true)

              if printf '%s' "$body" | grep -q 'User not authorised'; then
                echo "           ORIGEN: el GATEWAY. El cuerpo lleva la firma de Tyk."
              else
                echo "           ORIGEN: el UPSTREAM, no el gateway. El cuerpo no lleva"
                echo "           la firma de Tyk, asi que la autenticacion de consumidor"
                echo "           PASO y es el microservicio el que rechaza."
                echo "           Revisa UPSTREAM_${label##api-}_BASIC_USER y _BASIC_PASSWORD"
                echo "           de ESTE repo contra BASIC_AUTH_USER y BASIC_AUTH_PASSWORD"
                echo "           del repo del microservicio: deben coincidir."
                failed=1
                return 0
              fi

              # Aqui esta la pregunta que decide todo: la clave EXISTE en Redis?
              # Sin esto no se puede distinguir "nunca se creo" de "se creo con
              # otra contrasena", que se arreglan de formas distintas.
              # Tyk indexa las claves de basic auth como org_id + usuario.
              if [ -n "${TYK_SECRET:-}" ]; then
                local key_code
                key_code=$(curl --silent --output /dev/null --write-out '%{http_code}'                   --max-time 30 -H "x-tyk-authorization: ${TYK_SECRET}"                   "${URL}/tyk/keys/${TYK_ORG_ID}${user}")

                case "$key_code" in
                  404)
                    echo "           DIAGNOSTICO: la clave NO existe en Redis."
                    echo "           El aprovisionamiento la salto. provision_key.sh omite"
                    echo "           una API si le falta el usuario O la contrasena, y sigue"
                    echo "           con la siguiente, por eso la otra API si funciona."
                    echo "           Revisa que EXISTAN LOS DOS secrets de esta API."
                    ;;
                  200)
                    echo "           DIAGNOSTICO: la clave SI existe en Redis, asi que la"
                    echo "           contrasena almacenada no coincide con la enviada."
                    echo "           Suele ser un secret cambiado despues del ultimo"
                    echo "           aprovisionamiento, o espacios al principio o al final"
                    echo "           al pegar el valor."
                    ;;
                  *)
                    echo "           No se pudo consultar la clave: la API de admin devolvio ${key_code}"
                    ;;
                esac
              fi
              failed=1

            else
              echo "  ${label}: OK -> ${path} devolvio ${ok_code} (autenticacion superada)"
            fi

            # --- 2) una credencial incorrecta SI debe dar 401 ---
            local bad_code
            bad_code=$(curl --silent --output /dev/null --write-out '%{http_code}'               --max-time 30 --user "${user}:credencial-invalida-de-prueba" "${URL}${path}")

            if [ "$bad_code" != "401" ]; then
              echo "  ${label}: FALLO -> con contrasena incorrecta devolvio ${bad_code}, se esperaba 401"
              echo "           la API podria estar sin autenticacion (use_keyless)"
              failed=1
            else
              echo "  ${label}: OK -> contrasena incorrecta rechazada con 401"
            fi
          }

          echo "Comprobando que el gateway acepta las credenciales aprovisionadas:"
          check "api-users"  "/api-users/v1/users"  "$USERNAME_API_USERS"  "$PASSWORD_API_USERS"
          check "api-orders" "/api-orders/v1"      "$USERNAME_API_ORDERS" "$PASSWORD_API_ORDERS"

          if [ "$failed" != "0" ]; then
            {
              echo "### Las credenciales de consumidor NO funcionan"
              echo
              echo "El gateway devuelve 401 con la credencial aprovisionada."
              echo
              echo "Causas por orden de probabilidad:"
              echo
              echo "1. Los secrets USERNAME_API_* / PASSWORD_API_* no estaban configurados"
              echo "   cuando corrio el aprovisionamiento. Anadirlos NO aprovisiona nada"
              echo "   retroactivamente: hay que volver a lanzar la pipeline."
              echo "2. La replica del container app se ha reiniciado despues del"
              echo "   aprovisionamiento. Redis es un sidecar SIN persistencia, asi que"
              echo "   una replica nueva arranca vacia y pierde todas las credenciales."
              echo "3. La contrasena del secret no coincide con la que se aprovisiono."
              echo
              echo "Para reaprovisionar sin commit: Actions -> Run workflow con"
              echo "provision_keys en true."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "ERROR: el gateway no acepta las credenciales de consumidor." >&2
            echo "Ver el resumen del despliegue para las causas probables." >&2
            exit 1
          fi

          echo "Las credenciales de consumidor funcionan contra el gateway."

      - name: Deployment summary
        if: always()
        env:
          URL: ${{ steps.app.outputs.url }}
          WORKSPACE: ${{ steps.foundation.outputs.workspace_name }}
          APP_NAME: ${{ steps.app.outputs.container_app_name }}
          TYK_ORG_ID: ${{ vars.TYK_ORG_ID || 'poc-organization' }}
        run: |
          {
            echo "## Tyk OSS PoC deployed"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Gateway URL | ${URL} |"
            echo "| Resource group | ${AZURE_RESOURCE_GROUP} |"
            echo "| Log Analytics workspace | ${WORKSPACE} |"
            echo "| Region | ${AZURE_LOCATION} |"
            echo "| Image tag | ${GITHUB_SHA::12} |"
            echo
            echo "### Credenciales de consumidor"
            echo
            echo "En Basic Auth no hay client_id. Los identificadores son el usuario"
            echo "y el nombre de la clave en Tyk, que es org_id + usuario."
            echo
            echo "Usuario y contrasena de las dos APIs son SECRETOS del container app."
            echo "Para verlos:"
            echo
            echo '```bash'
            echo "az containerapp secret show -g ${AZURE_RESOURCE_GROUP} -n ${APP_NAME} --secret-name consumer-user-api-users"
            echo "az containerapp secret show -g ${AZURE_RESOURCE_GROUP} -n ${APP_NAME} --secret-name consumer-password-api-users"
            echo "az containerapp secret show -g ${AZURE_RESOURCE_GROUP} -n ${APP_NAME} --secret-name consumer-user-api-orders"
            echo "az containerapp secret show -g ${AZURE_RESOURCE_GROUP} -n ${APP_NAME} --secret-name consumer-password-api-orders"
            echo '```'
            echo
            echo "O en el portal: Container App -> Settings -> Secrets -> Reveal value."
            echo
            echo "El nombre de la clave en Tyk lo escribe el sidecar en su log en cada"
            echo "ciclo, con la linea \`provisioner: <api> key_id=<org><usuario>\`:"
            echo
            echo '```bash'
            echo "az containerapp logs show -g ${AZURE_RESOURCE_GROUP} -n ${APP_NAME} --container key-provisioner --tail 20"
            echo '```'
            echo
            echo "Y para comprobar si una credencial existe en Redis:"
            echo
            echo '```bash'
            echo "curl -s -o /dev/null -w '%{http_code}' \\"
            echo "  -H \"x-tyk-authorization: \$TYK_SECRET\" \\"
            echo "  ${URL}/tyk/keys/<key_id>"
            echo "# 200 = existe, 404 = no existe"
            echo '```'
            echo
            echo "Remember to run the destroy workflow when the PoC is over."
          } >> "$GITHUB_STEP_SUMMARY"
