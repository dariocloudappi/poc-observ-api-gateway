{
  "analytics_storage_type": "redis",
  "analytics_storage_config": {
    "type": "redis",
    "host": "localhost",
    "port": 6379,
    "username": "",
    "password": "",
    "database": 0,
    "optimisation_max_idle": 100,
    "optimisation_max_active": 200,
    "enable_cluster": false
  },
  "purge_delay": 10,
  "dont_purge_uptime_data": true,
  "pumps": {
    "prometheus": {
      "type": "prometheus",
      "meta": {
        "listen_address": ":9090",
        "path": "/metrics",
        "custom_metrics": []
      }
    },
    "stdout": {
      "type": "stdout",
      "meta": {
        "format": "json",
        "log_field_name": "tyk-analytics-record"
      }
    }
  }
}
