# =============================================================================
# OpenTelemetry Collector - Tyk OSS to New Relic
# -----------------------------------------------------------------------------
# Every environment specific value is resolved from environment variables:
#   NR_LICENSE_KEY            New Relic ingest license key (secret)
#   NR_OTLP_ENDPOINT          New Relic OTLP endpoint, e.g. https://otlp.eu01.nr-data.net:4318
#   ENVIRONMENT               deployment.environment resource attribute
#   SERVICE_NAMESPACE         service.namespace resource attribute
#   REDIS_ENDPOINT            host:port of the Redis instance to scrape
#   TYK_PUMP_METRICS_ENDPOINT host:port of the Tyk Pump prometheus pump
#   OTEL_TELEMETRY_LOG_LEVEL  collector self-telemetry log level
#
# Entrada de logs, dos receptores, los dos siempre escuchando:
#   - fluentforward (24224): en local, alimentado por el driver de logging
#     fluentd de docker compose.
#   - udplog (5170): en Azure, alimentado por el transporte logstash de Tyk.
#
# POR QUE UDP Y NO TCP
# --------------------
# El hook de logstash de Tyk abre su conexion al inicializarse y NO reintenta
# nunca. En Container Apps los contenedores de una replica arrancan en
# paralelo sin garantia de orden, y el gateway suele ganar la carrera al
# colector.
#
# Con TCP eso es fatal: connect contra localhost:5170 sin nadie escuchando da
# connection refused, el hook muere y no se envia ni una linea durante toda la
# vida del contenedor. Medido: 0 registros.
#
# Con UDP no: no hay conexion que rechazar y localhost siempre resuelve, asi
# que el hook se inicializa bien, los primeros datagramas se pierden mientras
# el colector arranca y a partir de ahi entran todos. Medido en un namespace
# de red compartido, con el gateway arrancado 25 s antes que el colector: 22
# registros recibidos y exportados a New Relic sin fallos.
#
# El precio es que UDP no garantiza entrega. Para una PoC de formacion es un
# intercambio razonable: se pierden los primeros segundos de arranque a cambio
# de que el canal no se pueda romper de forma permanente.
# =============================================================================

connectors:
  spanmetrics:
    histogram:
      exponential:
        max_size: 160
    exemplars:
      enabled: false
    dimensions:
      - name: http.method
      - name: http.status_code
      # http.route only if the APIs do not use dynamic path params.
      - name: http.route
      - name: tyk.api.name
    # Prefix of the generated metric names: tyk.gateway.calls and
    # tyk.gateway.duration. Dots because that is the OTel convention for metric
    # names, while the service.name of the gateway is tyk-gateway. Same words in
    # both, so the metrics are findable from the name used in traces and logs.
    namespace: tyk.gateway
    # Cardinality control matters more than resolution here.
    metrics_flush_interval: 60s
    aggregation_temporality: "AGGREGATION_TEMPORALITY_DELTA"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 127.0.0.1:1777

receivers:

  # Local mode: docker fluentd logging driver.
  fluentforward:
    endpoint: 0.0.0.0:24224

  # Azure: transporte logstash de Tyk, un documento JSON por datagrama.
  udplog/tyk:
    listen_address: 0.0.0.0:5170
    add_attributes: false
    attributes:
      log.source: tyk-logstash

  # Logs de los sidecars que NO pueden enviarlos por red.
  #
  # En Container Apps no se puede fijar el log driver de un contenedor ni leer
  # el stdout de otro, asi que cada uno escribe a un fichero en un volumen
  # EmptyDir compartido y este receptor los sigue. Ver infra/app.bicep.
  #
  #   redis.log      Redis, con --logfile
  #   collector.log  este propio colector, con service.telemetry.logs.output_paths
  #
  filelog/sidecars:
    include:
      - /var/log/pod/*.log
    start_at: beginning
    include_file_name: true
    include_file_path: false
    # Sin esto, un fichero que rota o se trunca se releeria entero.
    fingerprint_size: 1kb

  # Trazas del gateway, en Azure y en local. Este exportador SI reconecta solo
  # si el colector arranca despues, al contrario que el hook de logstash.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  redis:
    endpoint: "${env:REDIS_ENDPOINT}"
    collection_interval: 30s

  # Tyk Pump prometheus pump: per API traffic analytics.
  prometheus/tykpump:
    config:
      scrape_configs:
        - job_name: tyk-pump
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:TYK_PUMP_METRICS_ENDPOINT}"]

  # Self telemetry of the collector, exposed by service.telemetry.metrics below.
  # Without this nobody watches the watcher: a full sending queue, a rejected
  # export or a memory_limiter kicking in would silently drop data and the only
  # symptom would be missing telemetry, which is exactly what you cannot see.
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8888"]

processors:

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # Batching is tuned per signal: logs need lower latency than metrics.
  batch/traces:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  batch/metrics:
    timeout: 30s
    send_batch_size: 512
    send_batch_max_size: 1024

  batch/logs:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

  resource:
    attributes:
      - key: deployment.environment
        value: "${env:ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${env:SERVICE_NAMESPACE}"
        action: upsert
      - key: cloud.provider
        value: azure
        action: insert
      # Version de Tyk, para saber que gateway produjo la telemetria. Los dos
      # microservicios ya reportan service.version y el gateway no lo hacia.
      - key: service.version
        value: "${env:SERVICE_VERSION}"
        action: upsert

  filter/drop_health_traces:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/healthz"'
        - 'attributes["http.route"] == "/hello"'
        - 'IsMatch(attributes["http.url"], ".*/health.*")'

  transform/parse_tyk:
    error_mode: ignore
    log_statements:
      - context: log
        statements:

          # ------------------------------------------------------------
          # Parse the JSON payload emitted by the gateway
          # ------------------------------------------------------------

          - merge_maps(attributes, ParseJSON(body), "upsert")
            where body != nil and IsMatch(body, "^\\{")

          # ------------------------------------------------------------
          # Rebuild a readable message for access log records
          # ------------------------------------------------------------

          - >-
            set(body, Concat([attributes["type"], ": ",
            attributes["method"], " ", attributes["path"], " ",
            attributes["status"]], ""))
            where attributes["type"] == "request"
            and attributes["method"] != nil
            and attributes["path"] != nil
            and attributes["status"] != nil

          # ------------------------------------------------------------
          # Severity mapping
          # ------------------------------------------------------------

          - set(severity_number, 5)
            where attributes["level"] == "debug"

          - set(severity_number, 9)
            where attributes["level"] == "info"

          - set(severity_number, 13)
            where attributes["level"] == "warning" or attributes["level"] == "warn"

          - set(severity_number, 17)
            where attributes["level"] == "error"

          - set(severity_text, attributes["level"])
            where attributes["level"] != nil

          # ------------------------------------------------------------
          # service.name, service.instance.id and trace correlation
          # -----------------------------------------------------------
          # The value MUST be the same one the gateway reports on its spans
          # through TYK_GW_OPENTELEMETRY_RESOURCENAME, which is "tyk-gateway".
          # With a different spelling New Relic resolves two separate entities,
          # the "See logs" link of a span finds nothing, and any NRQL joining
          # Span and Log by service.name silently returns empty.
          # ------------------------------------------------------------

          - set(attributes["service.name"], "tyk-gateway")
            where attributes["container_name"] != nil and IsMatch(attributes["container_name"], ".*tyk-gateway.*")

          - set(attributes["service.name"], "tyk-gateway")
            where attributes["service.name"] == nil

          # service.instance.id is the semantic convention attribute. Named
          # service.instance it is just a custom attribute nothing consumes.
          - set(attributes["service.instance.id"], attributes["container_name"])
            where attributes["container_name"] != nil

          - set(attributes["trace.id"], attributes["trace_id"])
            where attributes["trace_id"] != nil

          # ------------------------------------------------------------
          # Normalize HTTP attributes
          # ------------------------------------------------------------

          - set(attributes["http.method"], attributes["method"])
            where attributes["method"] != nil

          - set(attributes["http.target"], attributes["path"])
            where attributes["path"] != nil

          - set(attributes["http.status_code"], attributes["status"])
            where attributes["status"] != nil

          - set(attributes["url.path"], attributes["path"])
            where attributes["path"] != nil

          # ------------------------------------------------------------
          # Audit trail: keep enough context to answer who, what and when
          # without leaking the API key itself. Only the last 4 characters
          # of the key identifier are kept.
          # ------------------------------------------------------------

          - >-
            set(attributes["auth.key_suffix"],
            Substring(attributes["api_key"], Len(attributes["api_key"]) - 4, 4))
            where attributes["api_key"] != nil and Len(attributes["api_key"]) > 8

          - delete_key(attributes, "api_key")
            where attributes["api_key"] != nil

          # ------------------------------------------------------------
          # Cleanup
          # ------------------------------------------------------------

          - delete_key(attributes, "msg")
            where attributes["msg"] != nil

          - delete_key(attributes, "trace_id")
            where attributes["trace_id"] != nil

  # service.name segun el fichero del que viene el registro. Sin esto todos los
  # logs de los sidecars caerian bajo tyk-gateway, que es el default que aplica
  # transform/parse_tyk, y en New Relic serian indistinguibles.
  transform/name_sidecar_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["service.name"], "tyk-redis")
            where attributes["log.file.name"] == "redis.log"
          - set(attributes["service.instance.id"], "tyk-redis")
            where attributes["log.file.name"] == "redis.log"

          - set(attributes["service.name"], "otel-collector")
            where attributes["log.file.name"] == "collector.log"
          - set(attributes["service.instance.id"], "otel-collector")
            where attributes["log.file.name"] == "collector.log"

          - set(attributes["log.source"], "sidecar-file")
            where attributes["log.file.name"] != nil

          # Nivel de los logs de Redis. Su formato es texto plano, no JSON, asi
          # que transform/parse_tyk no le aplica: el nivel va en un caracter
          # tras la fecha, "*" informativo y "#" aviso o error.
          #
          # Los marcadores van como clase de caracteres, [*] y [#], y no
          # escapados. Dos motivos: OTTL rechaza la barra invertida dentro de
          # sus cadenas entrecomilladas, y un "#" precedido de espacio haria
          # que YAML tomase el resto de la linea por un comentario. Dentro de
          # los corchetes no pasa ninguna de las dos cosas.
          - set(severity_number, 9)
            where attributes["log.file.name"] == "redis.log" and IsMatch(body, "[0-9]+:[A-Z] .* [*] ")
          - set(severity_number, 13)
            where attributes["log.file.name"] == "redis.log" and IsMatch(body, "[0-9]+:[A-Z] .* [#] ")
          - set(severity_text, "info")
            where attributes["log.file.name"] == "redis.log" and severity_number == 9
          - set(severity_text, "warning")
            where attributes["log.file.name"] == "redis.log" and severity_number == 13

  # ROMPE EL BUCLE DE REALIMENTACION. Sin esto el colector se autoalimenta:
  # ingiere sus propios logs, cada exportacion de logs escribe una linea de
  # debug en collector.log, filelog la lee, genera otro registro, que provoca
  # otra exportacion, que escribe otra linea. Con OTEL_TELEMETRY_LOG_LEVEL en
  # debug la amplificacion es inmediata y no converge.
  #
  # Se descartan las lineas del propio colector que hablan de exportar o
  # procesar telemetria, y se conserva lo que de verdad interesa vigilar:
  # arranque, errores, memory_limiter y datos rechazados.
  filter/break_collector_loop:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["log.file.name"] == "collector.log" and IsMatch(body, ".*(Exporter|otlphttp|Preparing to make HTTP request|batch|sending_queue|TracesExporter|MetricsExporter|LogsExporter).*")'

  filter/drop_noisy_logs:
    error_mode: ignore
    logs:
      log_record:
        # Health probe noise and gateway internal chatter.
        - 'severity_number <= 5 and IsMatch(body, ".*health.*")'
        - 'severity_number <= 5 and IsMatch(body, ".*Primary instance.*")'
        - 'IsMatch(body, "tyk-analytics=")'

  transform/remove_sensitive:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "APIKey") where attributes["APIKey"] != nil
          - delete_key(attributes, "IPAddress") where attributes["IPAddress"] != nil
          - delete_key(attributes, "RawRequest") where attributes["RawRequest"] != nil
          - delete_key(attributes, "RawResponse") where attributes["RawResponse"] != nil
          - delete_key(attributes, "origin") where attributes["origin"] != nil
          - delete_key(attributes, "Authorization") where attributes["Authorization"] != nil

          # ------------------------------------------------------------
          # El procesador "redaction" NO soporta logs en el colector
          # v0.100.0: declararlo en el pipeline de logs aborta el arranque
          # con "telemetry type is not supported". Sus blocked_values se
          # replican aqui con OTTL, que si funciona sobre logs.
          # Sin backreferencias ($1) a proposito: el colector expande "$"
          # como variable de entorno.
          # ------------------------------------------------------------

          # El cuantificador {16,} NO es cosmetico. Con "+" a secas este patron
          # matcheaba las PALABRAS "basic auth" del mensaje de error de Tyk
          #   Base64 Decoding failed of basic auth data: illegal base64 data...
          # y lo convertia en "... of REDACTED data: ...", destruyendo justo el
          # diagnostico que hacia falta para entender un 400. Una credencial
          # real en base64 pasa de 16 caracteres; palabras como "auth" o "data"
          # no llegan, asi que sobreviven al redactado.
          - replace_pattern(body, "(?i)(bearer|basic) +[A-Za-z0-9+/=._-]{16,}", "REDACTED")
            where IsString(body)

          - replace_pattern(body, "[a-f0-9]{64}", "REDACTED")
            where IsString(body)
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization") where attributes["http.request.header.authorization"] != nil
          - delete_key(attributes, "http.request.header.x-auth-token") where attributes["http.request.header.x-auth-token"] != nil
          - delete_key(attributes, "http.response.header.set-cookie") where attributes["http.response.header.set-cookie"] != nil
          - delete_key(attributes, "http.request.header.x-api-key") where attributes["http.request.header.x-api-key"] != nil

  redaction:
    allow_all_keys: true
    blocked_values:
      - "(?i)bearer\\s+[\\w.=_-]+"
      - "(?i)basic\\s+[A-Za-z0-9+/=]+"
      - "^[a-f0-9]{64}$"
    summary: debug

  resource/logs:
    attributes:
      - key: log.source
        value: tyk-gateway
        action: insert

  # -------------------------------------------------------------------------
  # One service.name per component of the container app
  # -------------------------------------------------------------------------
  # The metrics pipelines are split by source precisely so each one can be
  # stamped here: a processor applies to everything that crosses its pipeline,
  # so a single shared metrics pipeline cannot give different names to Redis,
  # the pump and the collector.
  #
  # Without these, Redis metrics arrive with NO service.name at all and land in
  # New Relic as an unnamed entity, and the pump gets its name by accident from
  # the Prometheus job_name instead of by decision.
  #
  # All of them keep the same service.namespace, so they stay grouped together
  # as components of one gateway even though they are separate entities.

  resource/redis:
    attributes:
      - key: service.name
        value: tyk-redis
        action: upsert
      - key: service.instance.id
        value: tyk-redis
        action: upsert

  resource/tykpump:
    attributes:
      - key: service.name
        value: tyk-pump
        action: upsert
      - key: service.instance.id
        value: tyk-pump
        action: upsert

  resource/collector:
    attributes:
      - key: service.name
        value: otel-collector
        action: upsert
      - key: service.instance.id
        value: otel-collector
        action: upsert

exporters:

  # Escribe en el stdout del colector un resumen por lote: cuantos spans,
  # metricas o logs ha pasado por cada pipeline. Es la unica forma de
  # distinguir "no entra nada al colector" de "entra pero no consigo
  # exportarlo a New Relic", y sin eso el diagnostico es a ciegas.
  #
  # verbosity basic a proposito, NO detailed: imprime solo contadores. Con
  # detailed volcaria el contenido de cada registro al log, lo que multiplica
  # el volumen y ademas sacaria a stdout cabeceras y cuerpos.
  debug:
    verbosity: basic

  otlphttp/newrelic:
    endpoint: "${env:NR_OTLP_ENDPOINT}"
    headers:
      api-key: "${env:NR_LICENSE_KEY}"
    compression: gzip
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100

service:

  extensions: [health_check, pprof]

  pipelines:

    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/drop_health_traces
        - resource
        - transform/remove_sensitive
        - redaction
        - batch/traces
      exporters: [otlphttp/newrelic, spanmetrics, debug]

    # One pipeline per source, so each component can be named explicitly.
    # Splitting is not cosmetic: a processor cannot distinguish which receiver
    # a metric came from, so a shared pipeline can only apply one name.

    # Derived from the gateway spans, so it already carries
    # service.name = tyk-gateway from the traces resource.
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors:
        - memory_limiter
        - resource
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/redis:
      receivers: [redis]
      processors:
        - memory_limiter
        - resource
        - resource/redis
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/tykpump:
      receivers: [prometheus/tykpump]
      processors:
        - memory_limiter
        - resource
        - resource/tykpump
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/collector:
      receivers: [prometheus/collector]
      processors:
        - memory_limiter
        - resource
        - resource/collector
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    logs:
      receivers: [fluentforward, udplog/tyk, filelog/sidecars]
      processors:
        - memory_limiter
        # El corta-bucles va PRIMERO: cuanto antes se descarte la
        # realimentacion, menos trabajo inutil hace el resto del pipeline.
        - filter/break_collector_loop
        - transform/parse_tyk
        - transform/name_sidecar_logs
        - filter/drop_noisy_logs
        - transform/remove_sensitive
        - resource
        - resource/logs
        - batch/logs
      exporters: [otlphttp/newrelic, debug]

  telemetry:
    logs:
      level: "${env:OTEL_TELEMETRY_LOG_LEVEL}"
      # Duplica los logs del colector a un fichero del volumen compartido para
      # que filelog/sidecars los recoja. stdout se mantiene: sin el, el log
      # stream de Container Apps se queda vacio y se pierde la unica forma de
      # depurar el colector cuando no consigue exportar.
      output_paths:
        - stdout
        - /var/log/pod/collector.log
    metrics:
      address: 0.0.0.0:8888
