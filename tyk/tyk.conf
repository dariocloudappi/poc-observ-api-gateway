{
  "listen_port": 443,
  "secret": "tyk-secret-change-me",
  "node_secret": "tyk-node-secret-change-me",
  "template_path": "/opt/tyk-gateway/templates",
  "tyk_js_path": "/opt/tyk-gateway/js/tyk.js",
  "middleware_path": "/opt/tyk-gateway/middleware",
  "app_path": "/opt/tyk-gateway/apps",
  "use_db_app_configs": false,
  "http_server_options": {
    "use_ssl": true,
    "ssl_insecure_skip_verify": false,
    "certificates": [
      {
      "domain_name": "{{DOMAIN_NAME}}",
      "cert_file": "/opt/tyk-gateway/certs/fullchain.pem",
      "key_file": "/opt/tyk-gateway/certs/privkey.pem"
      }
    ],
    "min_version": 771
  },
  "storage": {
    "type": "redis",
    "host": "tyk-redis",
    "port": 6379,
    "username": "",
    "password": "",
    "database": 0,
    "maxidle": 2000,
    "maxactive": 4000,
    "enablecluster": false
  },
  "policies": {
    "policy_source": "file",
    "policy_record_name": "/opt/tyk-gateway/policies/policies.json",
    "allow_explicit_policy_id": true
  },
  "enable_api_segregation": false,
  "enable_bundle_downloader": false,
  "log_level": "info",
  "enable_analytics": true,
  "analytics_config": {
    "enable_detailed_recording": true,
    "ignored_ips": []
  }
}