# =============================================================================
# OpenTelemetry Collector - Tyk OSS to New Relic
# -----------------------------------------------------------------------------
# Every environment specific value is resolved from environment variables:
#   NR_LICENSE_KEY            New Relic ingest license key (secret)
#   NR_OTLP_ENDPOINT          New Relic OTLP endpoint, e.g. https://otlp.eu01.nr-data.net:4318
#   ENVIRONMENT               deployment.environment resource attribute
#   SERVICE_NAMESPACE         service.namespace resource attribute
#   REDIS_ENDPOINT            host:port of the Redis instance to scrape
#   TYK_PUMP_METRICS_ENDPOINT host:port of the Tyk Pump prometheus pump
#   OTEL_TELEMETRY_LOG_LEVEL  collector self-telemetry log level
#
# Entrada de logs por dos receptores, ambos siempre activos:
#   - fluentforward (24224): entorno local, mediante el driver de logging
#     fluentd de docker compose.
#   - udplog (5170): Azure, mediante el transporte logstash de Tyk.
#
# El transporte es UDP y no TCP. El hook de logstash de Tyk abre la conexion al
# inicializarse y no reintenta. En Container Apps los contenedores de una
# replica arrancan en paralelo sin garantia de orden, de modo que con TCP un
# connection refused contra localhost:5170 deja el hook inservible durante toda
# la vida del contenedor. Con UDP no hay conexion que rechazar: solo se pierden
# los datagramas emitidos antes de que el colector escuche.
#
# La contrapartida es que UDP no garantiza la entrega.
# =============================================================================

connectors:
  spanmetrics:
    histogram:
      exponential:
        max_size: 160
    exemplars:
      enabled: false
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: tyk.api.name
      # Ruta agrupada, generada por transform/normalize_route. Sustituye a
      # http.route, que Tyk 5.12 no produce.
      - name: tyk.route
    # Prefijo de las metricas generadas: tyk.gateway.calls y
    # tyk.gateway.duration. Con puntos, segun la convencion de OTel para nombres
    # de metrica, frente al service.name del gateway, que es tyk-gateway.
    namespace: tyk.gateway
    # Intervalo amplio: aqui prima el control de cardinalidad sobre la
    # resolucion temporal.
    metrics_flush_interval: 60s
    aggregation_temporality: "AGGREGATION_TEMPORALITY_DELTA"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 127.0.0.1:1777

receivers:

  # Local mode: docker fluentd logging driver.
  fluentforward:
    endpoint: 0.0.0.0:24224

  # Azure: transporte logstash de Tyk, un documento JSON por datagrama.
  udplog/tyk:
    listen_address: 0.0.0.0:5170
    add_attributes: false
    attributes:
      log.source: tyk-logstash

  # Logs de los sidecars que NO pueden enviarlos por red.
  #
  # En Container Apps no se puede fijar el log driver de un contenedor ni leer
  # el stdout de otro, asi que cada uno escribe a un fichero en un volumen
  # EmptyDir compartido y este receptor los sigue. Ver infra/app.bicep.
  #
  #   redis.log      Redis, con --logfile
  #   collector.log  este propio colector, con service.telemetry.logs.output_paths
  #
  filelog/sidecars:
    include:
      - /var/log/pod/*.log
    start_at: beginning
    include_file_name: true
    include_file_path: false
    # Sin esto, un fichero que rota o se trunca se releeria entero.
    fingerprint_size: 1kb

  # Trazas del gateway, en Azure y en local. Este exportador SI reconecta solo
  # si el colector arranca despues, al contrario que el hook de logstash.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  redis:
    endpoint: "${env:REDIS_ENDPOINT}"
    collection_interval: 30s

  # Tyk Pump prometheus pump: per API traffic analytics.
  prometheus/tykpump:
    config:
      scrape_configs:
        - job_name: tyk-pump
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:TYK_PUMP_METRICS_ENDPOINT}"]

  # Self telemetry of the collector, exposed by service.telemetry.metrics below.
  # Without this nobody watches the watcher: a full sending queue, a rejected
  # export or a memory_limiter kicking in would silently drop data and the only
  # symptom would be missing telemetry, which is exactly what you cannot see.
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:8888"]

processors:

  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # Batching is tuned per signal: logs need lower latency than metrics.
  batch/traces:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  batch/metrics:
    timeout: 30s
    send_batch_size: 512
    send_batch_max_size: 1024

  batch/logs:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

  resource:
    attributes:
      - key: deployment.environment
        value: "${env:ENVIRONMENT}"
        action: upsert
      - key: service.namespace
        value: "${env:SERVICE_NAMESPACE}"
        action: upsert
      - key: cloud.provider
        value: azure
        action: insert
      # Version de Tyk, para identificar el gateway que produjo la telemetria.
      - key: service.version
        value: "${env:SERVICE_VERSION}"
        action: upsert


  filter/drop_health_traces:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/healthz"'
        - 'attributes["http.target"] == "/hello"'
        - 'IsMatch(attributes["http.url"], ".*/health.*")'

  # Genera tyk.route, la ruta agrupada que permite desglosar por recurso con
  # cardinalidad acotada. Ninguna dimension nativa de Tyk sirve para esto:
  #
  #   http.route    no lo produce Tyk 5.12.
  #   http.target   ruta cruda, /users/<uuid>/orders/<uuid>: una serie temporal
  #                 por identificador.
  #   span.name     igualmente cruda, y spanmetrics la anade siempre.
  #   tyk.api.path  listen path, /api-users/v1: no distingue recursos.
  #
  # Sustituye los identificadores por {id}, de modo que
  # /users/3fa85f64-.../orders/7c9e6679-... queda como /users/{id}/orders/{id}.
  #
  # Se declara en el pipeline de traces por delante de spanmetrics, dado que el
  # conector es un exporter de ese pipeline y recibe los spans ya transformados.
  #
  # Los patrones no usan barras invertidas porque OTTL las rechaza dentro de sus
  # cadenas: de ahi [?] en lugar de la forma escapada.
  transform/normalize_route:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["tyk.route"], attributes["http.target"])
            where attributes["http.target"] != nil

          # La query string tambien multiplica series: ?page=2&size=10.
          - replace_pattern(attributes["tyk.route"], "[?].*", "")
            where attributes["tyk.route"] != nil

          # uuid, el formato de identificador de los dos microservicios.
          - >-
            replace_pattern(attributes["tyk.route"],
            "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
            "{id}")
            where attributes["tyk.route"] != nil

          # Ids numericos. El patron exige la barra previa para no alterar /v1.
          - replace_pattern(attributes["tyk.route"], "/[0-9]+", "/{id}")
            where attributes["tyk.route"] != nil

  transform/parse_tyk:
    error_mode: ignore
    log_statements:
      - context: log
        statements:

          # ------------------------------------------------------------
          # Parseo del JSON que emite el gateway
          # ------------------------------------------------------------

          - merge_maps(attributes, ParseJSON(body), "upsert")
            where body != nil and IsMatch(body, "^\\{")

          # ------------------------------------------------------------
          # Reconstruccion de un mensaje legible para los access logs
          # ------------------------------------------------------------

          - >-
            set(body, Concat([attributes["type"], ": ",
            attributes["method"], " ", attributes["path"], " ",
            attributes["status"]], ""))
            where attributes["type"] == "request"
            and attributes["method"] != nil
            and attributes["path"] != nil
            and attributes["status"] != nil

          # ------------------------------------------------------------
          # Mapeo de severidad
          # ------------------------------------------------------------

          - set(severity_number, 5)
            where attributes["level"] == "debug"

          - set(severity_number, 9)
            where attributes["level"] == "info"

          - set(severity_number, 13)
            where attributes["level"] == "warning" or attributes["level"] == "warn"

          - set(severity_number, 17)
            where attributes["level"] == "error"

          - set(severity_text, attributes["level"])
            where attributes["level"] != nil

          # ------------------------------------------------------------
          # service.name, service.instance.id y correlacion de trazas
          # ------------------------------------------------------------
          # El valor debe coincidir con el que el gateway declara en sus spans
          # mediante TYK_GW_OPENTELEMETRY_RESOURCENAME, es decir "tyk-gateway".
          # Con otra escritura New Relic resuelve dos entidades distintas, el
          # enlace "See logs" de un span no encuentra nada y cualquier NRQL que
          # una Span y Log por service.name devuelve vacio.
          # ------------------------------------------------------------

          - set(attributes["service.name"], "tyk-gateway")
            where attributes["container_name"] != nil and IsMatch(attributes["container_name"], ".*tyk-gateway.*")

          - set(attributes["service.name"], "tyk-gateway")
            where attributes["service.name"] == nil

          # service.instance.id es el atributo de la convencion semantica. Con
          # el nombre service.instance seria un atributo propio que nada
          # consume.
          - set(attributes["service.instance.id"], attributes["container_name"])
            where attributes["container_name"] != nil

          - set(attributes["trace.id"], attributes["trace_id"])
            where attributes["trace_id"] != nil

          # ------------------------------------------------------------
          # Normalizacion de atributos HTTP
          # ------------------------------------------------------------

          - set(attributes["http.method"], attributes["method"])
            where attributes["method"] != nil

          - set(attributes["http.target"], attributes["path"])
            where attributes["path"] != nil

          - set(attributes["http.status_code"], attributes["status"])
            where attributes["status"] != nil

          - set(attributes["url.path"], attributes["path"])
            where attributes["path"] != nil

          # ------------------------------------------------------------
          # Trazabilidad de auditoria: se conserva el contexto suficiente para
          # saber quien, que y cuando, sin exponer la clave de API. Solo se
          # guardan los ultimos 4 caracteres del identificador.
          # ------------------------------------------------------------

          - >-
            set(attributes["auth.key_suffix"],
            Substring(attributes["api_key"], Len(attributes["api_key"]) - 4, 4))
            where attributes["api_key"] != nil and Len(attributes["api_key"]) > 8

          - delete_key(attributes, "api_key")
            where attributes["api_key"] != nil

          # ------------------------------------------------------------
          # Limpieza
          # ------------------------------------------------------------

          - delete_key(attributes, "msg")
            where attributes["msg"] != nil

          - delete_key(attributes, "trace_id")
            where attributes["trace_id"] != nil

  # service.name segun el fichero de origen del registro. Sin esta asignacion
  # todos los logs de los sidecars quedarian bajo tyk-gateway, el valor por
  # defecto de transform/parse_tyk, y serian indistinguibles en New Relic.
  transform/name_sidecar_logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["service.name"], "tyk-redis")
            where attributes["log.file.name"] == "redis.log"
          - set(attributes["service.instance.id"], "tyk-redis")
            where attributes["log.file.name"] == "redis.log"

          - set(attributes["service.name"], "otel-collector")
            where attributes["log.file.name"] == "collector.log"
          - set(attributes["service.instance.id"], "otel-collector")
            where attributes["log.file.name"] == "collector.log"

          - set(attributes["log.source"], "sidecar-file")
            where attributes["log.file.name"] != nil

          # Nivel de los logs de Redis. Su formato es texto plano, no JSON, de
          # modo que transform/parse_tyk no le aplica: el nivel es un caracter
          # tras la fecha, "*" para informativo y "#" para aviso o error.
          #
          # Los marcadores se expresan como clase de caracteres, [*] y [#], por
          # dos motivos: OTTL rechaza la barra invertida dentro de sus cadenas
          # entrecomilladas, y un "#" precedido de espacio haria que YAML tomase
          # el resto de la linea por un comentario.
          - set(severity_number, 9)
            where attributes["log.file.name"] == "redis.log" and IsMatch(body, "[0-9]+:[A-Z] .* [*] ")
          - set(severity_number, 13)
            where attributes["log.file.name"] == "redis.log" and IsMatch(body, "[0-9]+:[A-Z] .* [#] ")
          - set(severity_text, "info")
            where attributes["log.file.name"] == "redis.log" and severity_number == 9
          - set(severity_text, "warning")
            where attributes["log.file.name"] == "redis.log" and severity_number == 13

  # Rompe el bucle de realimentacion del colector. Sin este filtro el colector
  # ingiere sus propios logs: cada exportacion escribe una linea de debug en
  # collector.log, filelog la lee y genera otro registro, que provoca otra
  # exportacion. Con OTEL_TELEMETRY_LOG_LEVEL en debug la amplificacion no
  # converge.
  #
  # Se descartan las lineas del colector referidas a exportar o procesar
  # telemetria, y se conservan arranque, errores, memory_limiter y datos
  # rechazados.
  filter/break_collector_loop:
    error_mode: ignore
    logs:
      log_record:
        - 'attributes["log.file.name"] == "collector.log" and IsMatch(body, ".*(Exporter|otlphttp|Preparing to make HTTP request|batch|sending_queue|TracesExporter|MetricsExporter|LogsExporter).*")'

  filter/drop_noisy_logs:
    error_mode: ignore
    logs:
      log_record:
        # Ruido de las sondas de salud y trafico interno del gateway.
        - 'severity_number <= 5 and IsMatch(body, ".*health.*")'
        - 'severity_number <= 5 and IsMatch(body, ".*Primary instance.*")'
        - 'IsMatch(body, "tyk-analytics=")'

  transform/remove_sensitive:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "APIKey") where attributes["APIKey"] != nil
          - delete_key(attributes, "IPAddress") where attributes["IPAddress"] != nil
          - delete_key(attributes, "RawRequest") where attributes["RawRequest"] != nil
          - delete_key(attributes, "RawResponse") where attributes["RawResponse"] != nil
          - delete_key(attributes, "origin") where attributes["origin"] != nil
          - delete_key(attributes, "Authorization") where attributes["Authorization"] != nil

          # ------------------------------------------------------------
          # El procesador "redaction" no soporta logs en el colector v0.100.0:
          # declararlo en el pipeline de logs aborta el arranque con
          # "telemetry type is not supported". Sus blocked_values se replican
          # aqui con OTTL, que si opera sobre logs.
          #
          # Los patrones no usan backreferencias porque el colector expande el
          # simbolo de dolar como variable de entorno.
          # ------------------------------------------------------------

          # El cuantificador {16,} restringe el patron a credenciales reales.
          # Con "+" a secas tambien coincidiria con las palabras "basic auth"
          # del mensaje de error de Tyk
          #   Base64 Decoding failed of basic auth data: illegal base64 data...
          # que quedaria como "... of REDACTED data: ...", eliminando el
          # diagnostico necesario para interpretar un 400. Una credencial en
          # base64 supera los 16 caracteres; terminos como "auth" o "data" no.
          - replace_pattern(body, "(?i)(bearer|basic) +[A-Za-z0-9+/=._-]{16,}", "REDACTED")
            where IsString(body)

          - replace_pattern(body, "[a-f0-9]{64}", "REDACTED")
            where IsString(body)
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization") where attributes["http.request.header.authorization"] != nil
          - delete_key(attributes, "http.request.header.x-auth-token") where attributes["http.request.header.x-auth-token"] != nil
          - delete_key(attributes, "http.response.header.set-cookie") where attributes["http.response.header.set-cookie"] != nil
          - delete_key(attributes, "http.request.header.x-api-key") where attributes["http.request.header.x-api-key"] != nil

  redaction:
    allow_all_keys: true
    blocked_values:
      - "(?i)bearer\\s+[\\w.=_-]+"
      - "(?i)basic\\s+[A-Za-z0-9+/=]+"
      - "^[a-f0-9]{64}$"
    summary: debug

  resource/logs:
    attributes:
      - key: log.source
        value: tyk-gateway
        action: insert

  # -------------------------------------------------------------------------
  # Un service.name por componente del container app
  # -------------------------------------------------------------------------
  # Los pipelines de metricas estan separados por origen para poder asignar el
  # nombre aqui: un procesador se aplica a todo lo que atraviesa su pipeline, de
  # modo que un pipeline compartido no puede dar nombres distintos a Redis, al
  # pump y al colector.
  #
  # Sin estas asignaciones las metricas de Redis llegan sin service.name y
  # aparecen en New Relic como entidad sin nombre, y el pump toma su nombre del
  # job_name de Prometheus.
  #
  # Todos mantienen el mismo service.namespace, de forma que siguen agrupados
  # como componentes de un mismo gateway aunque sean entidades separadas.

  resource/redis:
    attributes:
      - key: service.name
        value: tyk-redis
        action: upsert
      - key: service.instance.id
        value: tyk-redis
        action: upsert

  resource/tykpump:
    attributes:
      - key: service.name
        value: tyk-pump
        action: upsert
      - key: service.instance.id
        value: tyk-pump
        action: upsert

  resource/collector:
    attributes:
      - key: service.name
        value: otel-collector
        action: upsert
      - key: service.instance.id
        value: otel-collector
        action: upsert

exporters:

  # Escribe en el stdout del colector un resumen por lote con el numero de
  # spans, metricas y logs que ha pasado por cada pipeline. Permite distinguir
  # entre "no entra telemetria al colector" y "entra pero no se exporta a New
  # Relic".
  #
  # La verbosidad es basic, no detailed: imprime solo contadores. Con detailed
  # se volcaria el contenido de cada registro, lo que multiplica el volumen y
  # expone cabeceras y cuerpos en stdout.
  debug:
    verbosity: basic

  otlphttp/newrelic:
    endpoint: "${env:NR_OTLP_ENDPOINT}"
    headers:
      api-key: "${env:NR_LICENSE_KEY}"
    compression: gzip
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100

service:

  extensions: [health_check, pprof]

  pipelines:

    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/drop_health_traces
        - resource
        # Debe preceder a spanmetrics: en otro orden la metrica no llevaria
        # tyk.route.
        - transform/normalize_route
        - transform/remove_sensitive
        - redaction
        - batch/traces
      exporters: [otlphttp/newrelic, spanmetrics, debug]

    # Un pipeline por origen, para poder nombrar cada componente. Un procesador
    # no distingue de que receptor procede una metrica, de modo que un pipeline
    # compartido solo podria aplicar un unico nombre.

    # Derivadas de los spans del gateway, por lo que ya llevan
    # service.name = tyk-gateway del resource del pipeline de traces.
    metrics/spanmetrics:
      receivers: [spanmetrics]
      processors:
        - memory_limiter
        - resource
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/redis:
      receivers: [redis]
      processors:
        - memory_limiter
        - resource
        - resource/redis
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/tykpump:
      receivers: [prometheus/tykpump]
      processors:
        - memory_limiter
        - resource
        - resource/tykpump
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    metrics/collector:
      receivers: [prometheus/collector]
      processors:
        - memory_limiter
        - resource
        - resource/collector
        - batch/metrics
      exporters: [otlphttp/newrelic, debug]

    logs:
      receivers: [fluentforward, udplog/tyk, filelog/sidecars]
      processors:
        - memory_limiter
        # El corta-bucles va primero: cuanto antes se descarte la
        # realimentacion, menos trabajo realiza el resto del pipeline.
        - filter/break_collector_loop
        - transform/parse_tyk
        - transform/name_sidecar_logs
        - filter/drop_noisy_logs
        - transform/remove_sensitive
        - resource
        - resource/logs
        - batch/logs
      exporters: [otlphttp/newrelic, debug]

  telemetry:
    logs:
      level: "${env:OTEL_TELEMETRY_LOG_LEVEL}"
      # Duplica los logs del colector en un fichero del volumen compartido para
      # que filelog/sidecars los recoja. Se mantiene stdout porque, sin el, el
      # log stream de Container Apps queda vacio.
      output_paths:
        - stdout
        - /var/log/pod/collector.log
    metrics:
      address: 0.0.0.0:8888
