{
  "listen_port": 8080,
  "secret": "",
  "node_secret": "",
  "template_path": "/opt/tyk-gateway/templates",
  "tyk_js_path": "/opt/tyk-gateway/js/tyk.js",
  "middleware_path": "/opt/tyk-gateway/middleware",
  "app_path": "/opt/tyk-gateway/apps",
  "use_db_app_configs": false,
  "http_server_options": {
    "use_ssl": false,
    "ssl_insecure_skip_verify": false,
    "certificates": [
      {
        "domain_name": "*",
        "cert_file": "/opt/tyk-gateway/certs/cert.pem",
        "key_file": "/opt/tyk-gateway/certs/key.pem"
      }
    ],
    "min_version": 771
  },
  "storage": {
    "type": "redis",
    "host": "localhost",
    "port": 6379,
    "username": "",
    "password": "",
    "database": 0,
    "maxidle": 500,
    "maxactive": 1000,
    "enablecluster": false
  },
  "policies": {
    "policy_source": "file",
    "policy_record_name": "/opt/tyk-gateway/policies/policies.json",
    "allow_explicit_policy_id": true
  },
  "enable_api_segregation": false,
  "enable_bundle_downloader": false,
  "log_level": "info",
  "enable_analytics": true,
  "analytics_config": {
    "enable_detailed_recording": false,
    "ignored_ips": []
  },
  "use_logstash": false,
  "logstash_transport": "tcp",
  "logstash_network_addr": "localhost:5170",
  "track_404_logs": false,
  "access_logs": {
    "enabled": true,
    "template": [
      "method",
      "path",
      "status",
      "latency_total",
      "latency_gateway",
      "upstream_latency",
      "trace_id",
      "api_id",
      "api_key",
      "client_ip",
      "user_agent",
      "upstream_status",
      "upstream_addr"
    ]
  }
}
